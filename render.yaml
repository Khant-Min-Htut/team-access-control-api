services:
  - type: redis
    name: team-access-control-redis
    plan: free
    ipAllowList: []

  - type: web
    name: team-access-control-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: team-access-control-api
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        fromDatabase:
          name: team-access-control-redis
          property: host
      - key: REDIS_PORT
        fromDatabase:
          name: team-access-control-redis
          property: port
      - key: REDIS_PASSWORD
        fromDatabase:
          name: team-access-control-redis
          property: password
      - key: REDIS_DB
        value: 0
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: SESSION_MAX_PER_USER
        value: 5
