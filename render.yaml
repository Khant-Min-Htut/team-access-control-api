services:
  - type: pgsql
    name: team-access-control-db
    plan: free
    databaseName: team_access_control
    user: team_access_control

  - type: redis
    name: team-access-control-redis
    plan: free
    ipAllowList: []

  - type: web
    name: team-access-control-api
    runtime: node
    plan: free
    buildCommand: "npm install && npx @nestjs/cli build"
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: team-access-control-api
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: team-access-control-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: SESSION_MAX_PER_USER
        value: 5
